ssName:"mt-0.5 h-3.5 w-3.5 shrink-0","aria-hidden":"true"}),l.jsxs("span",{children:[l.jsx("span",{className:"font-semibold",children:"المصدر:"})," ",r]})]}):null}const Ng=[{id:"about-rushd",question:"من هو رُشد؟",answer:"أنا رُشد، المساعد الافتراضي لمنصة مدار 28. أجيب من الأدلة المعتمدة في المنصة وأذكر المصدر والصفحة، وأدلّك على المسؤولة المختصة. وإن لم أجد إجابة موثقة أخبرتك بذلك.",keywords:["من انت","رشد","مساعد","وش تسوي","ماذا تفعل","تعريف"],category:"عام"},{id:"privacy",question:"هل يحفظ رُشد ما أكتبه؟",answer:"لا. المحادثة تبقى في متصفحك فقط وتُمسح عند إغلاق الصفحة، ولا تُرسل إلى أي خادم؛ لذا لا تكتب رقم الهوية أو الجوال أو أي بيانات شخصية للطالبة.",keywords:["خصوصية","يحفظ","بياناتي","امان","سرية","يرسل"],category:"عام"},{id:"noor-login",question:"كيف أدخل إلى نظام نور؟",answer:"ادخل إلى نظام نور عبر الرابط الرسمي، وسجّل الدخول بالنفاذ الوطني الموحد لولي الأمر، ثم اختر اسم الطالبة.",keywords:["نور","دخول نور","تسجيل دخول","نفاذ","حساب ولي الامر"],links:[{label:"نظام نور",url:"https://noor.moe.gov.sa"}],to:{label:"الخدمات المدرسية",path:"/services"},category:"خدمات"},{id:"results",question:"كيف أطّلع على نتائج ابنتي؟",answer:"تُعرض النتائج والشهادات في نظام نور بحساب ولي الأمر عند إتاحتها. ولأي استفسار عن الدرجات تواصل مع وكيلة المدرسة.",keywords:["نتيجة","نتائج","درجات","شهادة","تقرير","علامات"],links:[{label:"نظام نور",url:"https://noor.moe.gov.sa"}],contactId:"vice",category:"خدمات"},{id:"madrasati-login",question:"ابنتي لا تستطيع الدخول إلى منصة مدرستي",answer:"جرّب الدخول عبر النفاذ الوطني، وتأكد من كتابة اسم المستخدم دون مسافات. فإن استمرت المشكلة فتواصل مع مسؤولة منصة مدرستي، ولا ترسل كلمة المرور إلى أي أحد.",keywords:["مدرستي","كلمة المرور","كلمة السر","باسورد","نسيت","ما تدخل","دخول المنصة","حساب الطالبة"],links:[{label:"منصة مدرستي",url:"https://schools.madrasati.sa"}],contactId:"madrasati",category:"خدمات"},{id:"transport",question:"كيف أسجل ابنتي في النقل المدرسي؟",answer:"يُقدَّم طلب النقل المدرسي عبر نظام نور من حساب ولي الأمر، باختيار خدمة النقل المدرسي ثم اسم الطالبة، ومتابعة حالة الطلب من الصفحة نفسها.",keywords:["نقل","باص","حافلة","مواصلات","توصيل","سواق"],links:[{label:"نظام نور",url:"https://noor.moe.gov.sa"}],contactId:"transport",category:"خدمات"},{id:"absence",question:"ماذا أفعل إذا غابت ابنتي؟",answer:"من واجبات ولي الأمر في قواعد السلوك والمواظبة التواصل الفوري مع المدرسة عند غياب الابنة. وتُحال حالات الغياب بدون عذر إلى لجنة التوجيه الطلابي. وفي المدرسة يُقدَّم ما يثبت العذر لمسؤولة الغياب والمواظبة عند عودة الطالبة.",keywords:["غياب","غابت","عذر","تقرير طبي","مريضة","ما داومت","ما راحت المدرسه","بتغيب","غيبت"],to:{label:"إجراء الغياب",path:"/procedures#absence"},contactId:"attendance",source:{docId:"behavior-1447",section:"المادة 3",page:15},category:"مواظبة"},{id:"late",question:"ماذا يترتب على التأخر الصباحي؟",answer:"التأخر الصباحي مشكلة سلوكية من الدرجة الأولى في المرحلة المتوسطة. تتدرج الإجراءات مع التكرار: تنبيه شفهي، ثم تدوين المخالفة وإشعار ولي الأمر هاتفيًا وحسم درجة واحدة، ثم التحويل إلى الموجهة الطلابية لإعداد خطة تعديل سلوك.",keywords:["تأخر","تاخرت","متأخرة","الطابور","وصلت متأخر","تأخير","الصبح","جات متأخره","تتأخر"],to:{label:"إجراء التأخر الصباحي",path:"/procedures#late"},contactId:"vice",source:{docId:"behavior-1447",section:"المادة 10",page:26},category:"مواظبة"},{id:"leave",question:"كيف أستأذن لابنتي أثناء الدوام؟",answer:"يحضر ولي الأمر أو من يفوّضه رسميًا، ويُسجَّل الاستئذان لدى وكيلة المدرسة قبل خروج الطالبة. يُفضَّل الإبلاغ المسبق إن كان الموعد معروفًا.",keywords:["استئذان","استاذن","اطلعها","خروج","موعد مستشفى","اخذها بدري"],contactId:"vice",category:"مواظبة"},{id:"behavior-rules",question:"أين أجد قواعد السلوك والمواظبة؟",answer:"المرجع المعتمد هو «قواعد السلوك والمواظبة لطلبة التعليم العام» الإصدار الخامس 1447هـ، الصادر عن وزارة التعليم. يمكن قراءته كاملًا داخل المنصة في «الأدلة والأنظمة».",keywords:["قواعد","لائحة","مخالفة","عقوبة","قواعد السلوك","لائحة السلوك","نظام السلوك","المواظبة"],to:{label:"قراءة القواعد",path:"/library/behavior-1447"},source:{docId:"behavior-1447"},category:"توجيه"},{id:"behavior-grade",question:"كيف تُحسب درجة السلوك؟",answer:"درجة السلوك 100: ‏80 درجة للسلوك الإيجابي تُمنح في بداية كل فصل ويُحسم منها عند المخالفة، و20 درجة للسلوك المتميز تُكتسب بمهارات محددة. ويُحسم بحسب درجة المشكلة: الأولى درجة، الثانية درجتان، الثالثة ثلاث، الرابعة عشر، الخامسة خمس عشرة.",keywords:["درجة السلوك","درجات السلوك","كم درجة","خصم","حسم","نقصت درجتها","انخصم","السلوك من مية"],to:{label:"قواعد السلوك والمواظبة",path:"/guidance/behavior-attendance"},source:{docId:"behavior-1447",section:"المادتان 4 و5",page:16},category:"توجيه"},{id:"behavior-compensate",question:"كيف تعوّض ابنتي درجات السلوك؟",answer:"بتنفيذ مهارات السلوك المتميز المقترحة في القواعد، مثل المشاركة في الإذاعة أو حملة توعوية أو الخدمة المجتمعية، وتقديم الشواهد إلى وكيل شؤون الطلبة لتُحفظ في ملفها. يجوز تكرار السلوك المتميز دون أن يتجاوز المجموع 100 درجة.",keywords:["تعويض","تعوض","ترجع الدرجات","سلوك متميز","السلوك المتميز","شواهد","ترفع درجتها"],to:{label:"السلوك المتميز",path:"/guidance/excellent-behavior"},contactId:"vice",source:{docId:"behavior-1447",section:"المادتان 4 و5",page:16},category:"توجيه"},{id:"bullying",question:"ابنتي تتعرض للتنمر، ماذا أفعل؟",answer:"تواصل مع الموجهة الطلابية مباشرة، ودوّن ما حدث، واحفظ الرسائل إن كان التنمر إلكترونيًا، دون أن تواجه الطرف الآخر بنفسك. التنمر بجميع أشكاله من مشكلات الدرجة الخامسة في المرحلة المتوسطة، وتجتمع لجنة التوجيه الطلابي فور الواقعة. ويمكنك الاتصال بخط مساندة الطفل 116111.",keywords:["تنمر","يتنمرون","مضايقة","تضايقها","ضرب","سب","إساءة","يستهزئون","يطقطقون","يتمسخرون"],to:{label:"معًا ضد التنمر",path:"/guidance/bullying"},links:[{label:"خط مساندة الطفل 116111",url:"tel:116111"}],contactId:"counselor",source:{docId:"behavior-1447",section:"المادة 14",page:31},category:"توجيه"},{id:"growth",question:"ما خصائص ابنتي في المرحلة المتوسطة؟",answer:"من خصائص المرحلة كما في دليل التوجيه المهني: نمو واضح نحو النضج، وظهور القدرات الخاصة، والرغبة في الاستقلالية والقيادة، وزيادة المخاوف من المستقبل.",keywords:["خصائص النمو","مراهقة","تغيرت","عنيدة","افهم بنتي","مزاجها","استقلالية","المرحلة المتوسطة"],to:{label:"افهمي ابنتك",path:"/guidance/growth"},contactId:"counselor",source:{docId:"career-guidance-1444",section:"المرحلة المتوسطة",page:24},category:"توجيه"},{id:"counselor",question:"كيف أتواصل مع الموجهة الطلابية؟",answer:"تجد طريقة التواصل مع الموجهة الطلابية في «مركز التواصل»، وتُعامل المعلومات التي تشاركها معها بسرية.",keywords:["موجهة","مرشدة","المرشدة الطلابية","الاخصائية","استشارة"],to:{label:"مركز التواصل",path:"/contact"},contactId:"counselor",category:"تواصل"},{id:"exams-prep",question:"كيف تستعد ابنتي للاختبارات؟",answer:"تُقسَّم المادة إلى أجزاء صغيرة، وتكون المذاكرة على فترات قصيرة مع اختبار الذات بالأسئلة، مع الحرص على النوم الكافي. وفي قسم التوجيه الطلابي دليل مفصل.",keywords:["اختبار","اختبارات","مذاكرة","امتحان","قلق الاختبار","توتر","استعداد"],to:{label:"الاستعداد للاختبارات",path:"/guidance/exams"},category:"توجيه"},{id:"exam-dates",question:"متى الاختبارات؟",answer:"تُعلن مواعيد الاختبارات في التقويم المدرسي بعد اعتمادها. المواعيد الظاهرة حاليًا تجريبية ومعلَّمة بذلك، فالمعتمد هو إعلان المدرسة الرسمي.",keywords:["موعد الاختبارات","متى الاختبار","جدول الاختبارات","تاريخ الاختبار"],to:{label:"التقويم",path:"/events"},contactId:"vice",category:"تقويم"},{id:"holidays",question:"متى الإجازة؟",answer:"الإجازات الرسمية يحددها التقويم الدراسي المعتمد من وزارة التعليم. تظهر في تقويم المنصة بعد اعتمادها، والمواعيد المعلّمة «تجريبي» ليست رسمية.",keywords:["اجازة","إجازة","عطلة","متى الاجازة","نهاية الفصل"],to:{label:"التقويم",path:"/events"},category:"تقويم"},{id:"mawhiba",question:"كيف تسجل ابنتي في موهبة؟",answer:"يُفتح التسجيل في مقياس موهبة وبرامجها في فترات تعلنها مؤسسة موهبة عبر موقعها الرسمي. ومنسقة موهبة في المدرسة تساعدك في الترشيح والمتابعة.",keywords:["موهبة","موهوبة","مقياس موهبة","الموهوبين","برامج اثرائية","إبداع","اولمبياد"],links:[{label:"موقع موهبة",url:"https://www.mawhiba.sa"}],to:{label:"موهبة والإبداع",path:"/mawhiba"},category:"موهبة"},{id:"volunteer",question:"كيف تشارك ابنتي في العمل التطوعي؟",answer:"تجد مبادرات المدرسة وشروط المشاركة في قسم العمل التطوعي، أما التسجيل الرسمي وتوثيق الساعات فعبر المنصة الوطنية للعمل التطوعي بإشراف ولي الأمر.",keywords:["تطوع","تطوعي","ساعات تطوعية","شهادة تطوع","مبادرة"],links:[{label:"المنصة الوطنية للعمل التطوعي",url:"https://www.nvg.gov.sa"}],to:{label:"العمل التطوعي",path:"/volunteer"},category:"تطوع"},{id:"update-phone",question:"كيف أحدّث رقم جوالي لدى المدرسة؟",answer:"حدّث بيانات التواصل عبر نظام نور إن كانت الخدمة متاحة، أو تواصل مع المدرسة لتحديثها بعد التحقق من هوية ولي الأمر.",keywords:["تحديث رقم","تغيير الجوال","رقم جديد","تحديث البيانات","الرسائل ما توصل"],contactId:"vice",category:"خدمات"},{id:"meet-teacher",question:"كيف أطلب موعدًا مع المديرة أو الوكيلة أو الموجهة؟",answer:"من «مركز التواصل» اختر «طلب موعد»، ثم المسؤولة والأيام المناسبة؛ فتُجهَّز رسالة واتساب تراجعها ثم ترسلها. والطلب ليس حجزًا، إذ يُعتمد الموعد بعد تأكيد المسؤولة.",keywords:["مقابلة","اقابل","معلمة","زيارة المدرسة","موعد","ابي موعد","ابغى اقابل","المديرة","اجي المدرسة"],to:{label:"طلب موعد",path:"/contact?kind=appointment"},contactId:"vice",category:"تواصل"},{id:"nafs",question:"ما اختبارات نافس؟",answer:"اختبارات وطنية تنفذها وزارة التعليم بالتعاون مع هيئة تقويم التعليم والتدريب، وتشمل جميع فصول الصف الثالث المتوسط في القراءة والرياضيات والعلوم. ونتائجها وتقارير الأداء متاحة لولي الأمر في منصة «مستقبلهم».",keywords:["نافس","الاختبارات الوطنية","ثالث متوسط","اختبار نافس","نتائج نافس"],to:{label:"اختبارات نافس",path:"/nafs"},links:[{label:"موقع نافس الرسمي",url:"https://nafs.etec.gov.sa/"}],category:"اختبارات"},{id:"mustaqbalhum",question:"ما منصة مستقبلهم؟",answer:"منصة من هيئة تقويم التعليم والتدريب لأولياء الأمور، للاطلاع على نتائج الاختبارات الرسمية وتقارير الأداء، وتدريب الأبناء على المقاييس.",keywords:["مستقبلهم","نافس","هيئة تقويم التعليم","الاختبارات الوطنية","نتائج نافس"],links:[{label:"منصة مستقبلهم",url:"https://mustaqbalhum.etec.gov.sa/"}],category:"خدمات"},{id:"tele . (مثال تجريبي — في الأرشيف)",audience:["الطالبات"],status:"draft"}],ls={وطنية:{dot:"bg-sage-500",chip:"bg-sage-50 text-sage-700 border-sage-200",icon:"flag"},عالمية:{dot:"bg-lav-400",chip:"bg-lav-50 text-lav-700 border-lav-200",icon:"globe"},تربوية:{dot:"bg-ink-600",chip:"bg-ink-200/40 text-ink-800 border-ink-200",icon:"heart"},اختبارات:{dot:"bg-gold-500",chip:"bg-gold-100 text-gold-700 border-gold-100",icon:"pencil"},إجازات:{dot:"bg-sage-300",chip:"bg-sage-50 text-sage-600 border-sage-100",icon:"sun"},أنشطة:{dot:"bg-lav-600",chip:"bg-lav-100 text-lav-800 border-lav-200",icon:"sparkles"}},Ig=[{id:"late",title:"التأخر الصباحي",icon:"clock",when:"عند وصول الطالبة بعد بداية اليوم الدراسي.",steps:[{text:"التأخر الصباحي مشكلة سلوكية من الدرجة الأولى في المرحلة المتوسطة.",basis:"rule"},{text:"تتدرج الإجراءات مع التكرار: تنبيه شفهي، ثم تدوين المخالفة وإشعار ولي الأمر هاتفيًا وحسم درجة، ثم التحويل إلى الموجهة الطلابية لإعداد خطة تعديل سلوك.",basis:"rule"},{text:"عند تكرار التأخر، يُستحسن تواصل الأسرة مع المدرسة لفهم السبب والاتفاق على حل.",basis:"school"}],contactId:"vice",source:{docId:"behavior-1447",section:"المادة 10",page:26},tags:["تأخر","تاخير","متأخرة","الطابور","الاصطفاف","وصلت متأخر"]},{id:"absence",title:"الغياب",icon:"calendar",when:"عند غياب الطالبة يومًا دراسيًا أو أكثر.",steps:[{text:"من واجبات ولي الأمر التواصل الفوري مع المدرسة عند غياب الابنة.",basis:"rule"},{text:"تُحال حالات الغياب بدون عذر إلى لجنة التوجيه الطلابي، ويُوثَّق الغياب يوميًا في النظام الإلكتروني المعتمد.",basis:"rule"},{text:"تقديم ما يثبت العذر (كالتقرير الطبي) لمسؤولة الغياب والمواظبة عند عودة الطالبة.",basis:"school"},{text:"متابعة ما فات الطالبة عبر منصة مدرستي.",basis:"school"}],requirements:["ما يثبت العذر إن وُجد"],contactId:"attendance",source:{docId:"behavior-1447",section:"المادة 3",page:15},tags:["غياب","غابت","عذر","تقرير طبي","مريضة","ما داومت","مواظبة"]},{id:"behavior-points",title:"تعويض درجات السلوك",icon:"award",when:"إذا حُسمت درجات من السلوك الإيجابي، أو لرفع درجة السلوك المتميز.",steps:[{text:"درجة السلوك 100: ‏80 للسلوك الإيجابي و20 للسلوك المتميز.",basis:"rule"},{text:"تنفّذ الطالبة مهارات السلوك المتميز المقترحة في القواعد، ويجوز تكرارها دون تجاوز 100 درجة.",basis:"rule"},{text:"تُقدَّم الشواهد إلى وكيل شؤون الطلبة وتُحفظ في ملف الطالبة.",basis:"rule"}],requirements:["شاهد على تنفيذ المهارة (صورة، شهادة، تقرير مشاركة)"],contactId:"vice",source:{docId:"behavior-1447",section:"المادتان 4 و5",page:16},tags:["تعويض","درجات السلوك","سلوك متميز","حسم","خصم","نقاط"]},{id:"bullying-report",title:"الإبلاغ عن تنمر",icon:"shield",when:"عند تعرّض الطالبة أو زميلة لها لإيذاء متكرر نفسي أو جسدي، مباشر أو عبر التقنية.",steps:[{text:"التنمر بجميع أنواعه وأشكاله من مشكلات الدرجة الخامسة في المرحلة المتوسطة، وتجتمع لجنة التوجيه الطلابي فور وقوعه.",basis:"rule"},{text:"التواصل مع الموجهة الطلابية مباشرة، مع تدوين ما حدث وحفظ الرسائل أو الصور إن كان إلكترونيًا.",basis:"school"},{text:"عدم مواجهة الطرف الآخر أو أسرته شخصيًا؛ المدرسة تتولى الإجراءات.",basis:"school"}],contactId:"counselor",source:{docId:"behavior-1447",section:"المادة 14",page:31},link:{label:"خط مساندة الطفل 116111",url:"tel:116111"},tags:["تنمر","مضايقة","إساءة","ضرب","سب","استهزاء","تنمر إلكتروني","بلاغ"]},{id:"visit",title:"زيارة المدرسة ومقابلة المسؤولات",icon:"users",when:"لمقابلة المديرة أو الوكيلة أو الموجهة الطلابية أو معلمة.",steps:[{text:"طلب موعد مسبق من «مركز التواصل» مع ذكر الموضوع باختصار.",basis:"school"},{text:"تأكيد الموعد يصل من المسؤولة نفسها؛ لا يُعد الطلب حجزًا حتى يُؤكَّد.",basis:"school"},{text:"الحالات العاجلة لا تنتظر موعدًا: الاتصال بالمسؤولة مباشرة.",basis:"school"}],contactId:"vice",proposed:!0,tags:["زيارة","موعد","مقابلة","اقابل","معلمة","المديرة"]},{id:"leave",title:"الاستئذان أثناء الدوام",icon:"clipboard",when:"عند الحاجة لخروج الطالبة قبل نهاية اليوم الدراسي.",steps:[{text:"يحضر ولي الأمر أو من يفوّضه رسميًا، ويُسجَّل الاستئذان لدى وكيلة المدرسة قبل خروج الطالبة.",basis:"school"},{text:"يُفضَّل الإبلاغ المسبق إن كان الموعد معروفًا.",basis:"school"}],requirements:["هوية ولي الأمر أو التفويض"],contactId:"vice",proposed:!0,tags:["استئذان","استاذن","خروج","موعد مستشفى","اخذها بدري"]},{id:"transport",title:"التسجيل في النقل المدرسي",icon:"bus",when:"عند الرغبة في خدمة النقل المدرسي أو متابعة طلب قائم.",steps:[{text:"الدخول إلى نظام نور بحساب ولي الأمر عبر النفاذ الوطني.",basis:"school"},{text:"اختيار خدمة النقل المدرسي ثم اسم الطالبة، وإكمال البيانات ومتابعة حالة الطلب.",basis:"school"},{text:"أي ملاحظة على النقل: التواصل مع مسؤولة النقل المدرسي.",basis:"school"}],contactId:"transport",link:{label:"نظام نور",url:"https://noor.moe.gov.sa"},tags:["نقل","باص","حافلة","مواصلات","توصيل"]},{id:"madrasati",title:"تعذّر الدخول إلى منصة مدرستي",icon:"monitor",when:"عند نسيان كلمة المرور أو ظهور خطأ في الدخول.",steps:[{text:"تجربة الدخول عبر النفاذ الوطني، وكتابة اسم المستخدم دون مسافات.",basis:"school"},{text:"إن استمرت المشكلة: التواصل مع مسؤولة منصة مدرستي، دون إرسال كلمة المرور لأي أحد.",basis:"school"}],contactId:"madrasati",link:{label:"منصة مدرستي",url:"https://schools.madrasati.sa"},tags:["مدرستي","كلمة المرور","باسورد","نسيت","دخول","حساب"]}],Rg=[{id:"behavior-attendance",title:"قواعد السلوك والمواظبة",summary:"ملخص موثّق من «قواعد السلوك والمواظبة» 1447هـ (الإصدار الخامس)، مع الإحالة إلى الصفحة.",icon:"scale",audience:["أولياء الأمور","الطالبات"],docId:"behavior-1447",sections:[{heading:"درجة السلوك",points:["درجة السلوك 100: ‏80 درجة للسلوك الإيجابي تُمنح في بداية كل فصل ويُحسم منها عند المخالفة، و20 درجة للسلوك المتميز تُكتسب بمهارات محددة.","يمكن تعويض ما حُسم بتنفيذ مهارات السلوك المتميز، على ألا يتجاوز المجموع 100 درجة."],source:{docId:"behavior-1447",section:"المادة 4",page:16}},{heading:"مقدار الحسم بحسب درجة المشكلة",points:["الدرجة الأولى: درجة واحدة.","الدرجة الثانية: درجتان.","الدرجة الثالثة: ثلاث درجات.","الدرجة الرابعة: عشر درجات.","الدرجة الخامسة: خمس عشرة درجة."],source:{docId:"behavior-1447",section:"المادة 5",page:17}},{heading:"المواظبة والتأخر",points:["المواظبة: التزام الطالبة بالحضور إلى المدرسة أو عبر المنصات المعتمدة وفق المواعيد المحددة من بداية اليوم الدراسي إلى نهايته.","التأخر الصباحي مشكلة من الدرجة الأولى في المرحلة المتوسطة، وتتدرج إجراءاته من التنبيه الشفهي إلى التحويل للموجهة الطلابية."],source:{docId:"behavior-1447",section:"المادتان 1 و10",page:26}},{heading:"من واجبات الأسرة",points:["الاطلاع على أنظمة المدرسة وقواعدها ومناقشتها مع الأبناء.","التواصل الفوري مع المدرسة عند غياب الابنة، وغرس الانضباط بالحرص على الحضور.","الوعي بخصائص مراحل النمو لدى الأبناء.","متابعة الأبناء وتوجيههم نحو التفاعل الرقمي المسؤول."],source:{docId:"behavior-1447",section:"المادة 3",page:14}}],tags:["سلوك","مواظبة","غياب","مخالفة","انضباط","قواعد","درجات السلوك","حسم","خصم"]},{id:"excellent-behavior",title:"السلوك المتميز",summary:"ما السلوك المتميز، وكيف تكتسب الطالبة درجاته العشرين أو تعوّض ما حُسم منها.",icon:"award",audience:["الطالبات","أولياء الأمور"],docId:"behavior-1447",sections:[{heading:"التعريف",points:["السلوك الذي يعكس المهارات المتميزة المتسقة مع القيم الإسلامية والهوية الوطنية."],source:{docId:"behavior-1447",section:"المادة 1",page:3}},{heading:"القيم التي يُقيَّم بها",points:["الانضباط، التسامح، الأمانة، العزيمة، التعاون، الانتماء الوطني."],source:{docId:"behavior-1447",section:"المادة 5",page:19}},{heading:"موضوعات مقترحة في القواعد",points:["الولاء للقيادة والوطن، وتعزيز اللغة العربية.","الاعتدال ونبذ التطرف، والتسامح ونبذ التمييز والعصبية.","الرفق ونبذ العنف، والحد من التنمر، ومهارات الحوار.","المهارات النفسية والاجتماعية، والتطوير الشخصي، والعناية بالبيئة المدرسية."],source:{docId:"behavior-1447",section:"المادة 5",page:18}},{heading:"أمثلة على المشاركات التي تُحتسب",points:["الانضباط وعدم الغياب بدون عذر خلال الفصل الدراسي.","المشاركة في الخدمة المجتمعية، أو حملة توعوية، أو تقديم فعالية حوارية.","المشاركة في الإذاعة، وكتابة رسالة شكر، وتقديم مقترح لصالح المجتمع المدرسي.","السلوك المتميز غير المذكور تقدّر المدرسة درجته بتوصية لجنة التوجيه الطلابي."],source:{docId:"behavior-1447",section:"المادة 5",page:19}},{heading:"الشواهد",points:["تُقدَّم شواهد السلوك المتميز إلى وكيل شؤون الطلبة وتُحفظ في ملف الطالبة، ويجوز تكرار السلوك دون تجاوز 100 درجة."],source:{docId:"behavior-1447",section:"المادة 4",page:16}}],tags:["تميز","سلوك متميز","تعزيز","سلوك إيجابي","تكريم","تعويض","درجات"]},{id:"values",title:"القيم المدرسية",summary:"القيم التي نعمل عليها طوال العام، وقيمة كل أسبوع.",icon:"gem",audience:["الطالبات","أولياء الأمور"],sections:[{heading:"كيف نعمل على القيم؟",points:["قيمة محورية لكل أسبوع تظهر في الصفحة الرئيسية.","أنشطة صفية قصيرة وممارسات يومية مرتبطة بالقيمة.","نقترح على الأسرة ممارسة بسيطة في البيت تدعم القيمة نفسها."]}],tags:["قيم","قيمة الأسبوع","أخلاق"]},{id:"family",title:"الإرشاد الأسري",summary:"توجيهات للأسرة في مرحلة المراهقة المبكرة والتواصل مع الابنة.",icon:"home",audience:["أولياء الأمور"],sections:[{heading:"التواصل في سن المراهقة",points:["خصّص وقتًا ثابتًا للحديث دون هواتف ولا مقاطعة.","استمع لتفهم قبل أن توجّه، وتقبّل مشاعرها وإن اختلفت مع تصرفها.","ضع القواعد بوضوح وبالاتفاق، واشرح سببها."]},{heading:"متى يُطلب دعم الموجهة الطلابية؟",points:["تغيّر واضح ومستمر في المزاج أو النوم أو الأكل أو الرغبة في الذهاب للمدرسة.","تراجع دراسي مفاجئ دون سبب معروف.","خلافات متكررة مع الزميلات أو شعور بالعزلة."]}],tags:["أسرة","مراهقة","تواصل","إرشاد","تربية"]},{id:"exams",title:"الاستعداد للاختبارات",summary:"خطة بسيطة للمذاكرة وإدارة القلق قبل الاختبار وأثناءه.",icon:"pencil",audience:["الطالبات","أولياء الأمور"],sections:[{heading:"قبل الاختبارات",points:["تقسيم المادة إلى أجزاء صغيرة وتوزيعها على الأيام المتبقية.","المذاكرة على فترات قصيرة تتخللها راحة قصيرة.","اختبار الذات بالأسئلة بدل الاكتفاء بإعادة القراءة.","النوم الكافي ليلة الاختبار أنفع من السهر."]},{heading:"يوم الاختبار",points:["إفطار خفيف، والحضور مبكرًا.","قراءة الأسئلة كاملة أولًا، والبدء بالأسهل.","عند الشعور بالتوتر: نفَس عميق وبطيء عدة مرات."]},{heading:"دور الأسرة",points:["وفّر مكانًا هادئًا ووقتًا منظمًا للمذاكرة.","شجّع الجهد، وتجنّب المقارنة بالأخريات."]}],tags:["اختبارات","مذاكرة","قلق","توتر","امتحان"]},{id:"bullying",t
